<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch AI – Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <!-- Authentic Scratch Top Header Bar -->
    <header class="header">
      <div class="brand">
        <span class="logo-bubble">Scratch AI</span>
        <span class="brand-title">Extension Settings</span>
      </div>
    </header>

    <div class="options-body">
      <form id="settingsForm">
        <!-- Backend URL Field -->
        <div class="form-group">
          <label for="backendUrlInput">Backend Server URL</label>
          <input type="url" id="backendUrlInput" class="input-text" placeholder="http://localhost:3000" required>
          <div class="field-hint">
            Address of your central Node.js backend (Default: <code>http://localhost:3000</code>)
          </div>
        </div>

        <!-- Appearance Field -->
        <div class="form-group">
          <label for="themeSelect">Popup & Settings Theme</label>
          <select id="themeSelect" class="input-select">
            <option value="auto">System Default (Auto)</option>
            <option value="light">Light Mode (Classic Scratch)</option>
            <option value="dark">Dark Mode</option>
          </select>
        </div>

        <!-- Anonymous Voter UUID Field -->
        <div class="form-group">
          <label for="userIdDisplay">Your Anonymous Voter ID (UUID)</label>
          <div class="input-with-button">
            <input type="text" id="userIdDisplay" class="input-text input-uuid" readonly spellcheck="false" title="Your anonymous voter UUID">
            <button type="button" id="copyIdBtn" class="btn btn-secondary btn-copy" title="Copy UUID to clipboard">
              📋 Copy
            </button>
          </div>
          <div class="field-hint">
            Unique anonymous identifier stored locally. No account required.
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="btn-group">
          <button type="submit" class="btn btn-primary" id="saveBtn">
            💾 Save Settings
          </button>
          <button type="button" id="testConnectionBtn" class="btn btn-secondary">
            🔌 Test Connection
          </button>
        </div>
      </form>

      <!-- Feedback / Status message -->
      <div id="statusMsg" class="status-msg"></div>

      <!-- Legal & Privacy Policy Link -->
      <div class="options-footer">
        <a id="legalLink" href="#" target="_blank" rel="noopener noreferrer" class="legal-link">
          ⚖️ Mentions Légales & Politique de Confidentialité (RGPD)
        </a>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
